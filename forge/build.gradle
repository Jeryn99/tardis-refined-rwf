plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id "net.darkhax.curseforgegradle" version "1.1.+"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "tardis_refined_rwf-common.mixins.json"
        mixinConfig "tardis_refined_rwf.mixins.json"
    }

    runs {
        data {
            data()

            programArgs "--all",
                    "--mod", "tardis_refined_rwf",
                    "--output", file("src/generated/resources").absolutePath,
                    "--existing", file("src/main/resources").absolutePath
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[Forge] TARDIS Refined: Real World Flight - v$rootProject.minecraft_version-$project.version"
        releaseType = "release"
        changelog = new File("${rootProject.projectDir}/changelog.html").text
        gameVersions = ["1.20", "1.20.1"]
        mainPublication tasks.remapJar
        gameLoaders = ["forge"]

        relations {
            depends {
                modrinth = "tardis-refined"
            }
        }

        var MODRINTH_TOKEN = project.findProperty("modrinth") ?: System.getenv("modrinth") ?: ""
        if (MODRINTH_TOKEN != "") {
            modrinth {
                token = MODRINTH_TOKEN
                id = "46RTtJYY"
                version = "$project.version+$project.name"
            }
        }
    }
}

// CurseForge upload - unifiedPublishing's CurseGradle is archived and can't send the required environment tag.
var curseToken = project.findProperty("curseforge") ?: System.getenv("curseforge") ?: ""

tasks.register("publishCurseForge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "upload"
    disableVersionDetection()
    onlyIf { curseToken != "" }

    apiToken = curseToken

    def mainFile = upload("1590174", tasks.remapJar)
    mainFile.changelogType = "html"
    mainFile.changelog = new File("${rootProject.projectDir}/changelog.html")
    mainFile.releaseType = "release"
    mainFile.addGameVersion("1.20", "1.20.1")
    mainFile.addJavaVersion("Java 17")
    mainFile.addModLoader("Forge")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addRequirement("tardis-refined")
}

configurations {
    common
    shadowCommon
    minieBundle

    compileClasspath.extendsFrom common, minieBundle
    runtimeClasspath.extendsFrom common, minieBundle
    developmentForge.extendsFrom common, minieBundle

    minieBundle.exclude group: "org.slf4j"
    minieBundle.exclude group: "com.simsilica"
    shadowCommon.exclude group: "org.slf4j"
    shadowCommon.exclude group: "com.simsilica"
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    modImplementation "ignored:tardis_refined:${rootProject.tardis_refined_version}:forge"

    // weather2 (+ its own required dependency, coroutil) - dev/testing only. This is
    // NOT bundled into the built jar and isn't a hard dependency of the mod itself:
    // Weather2ReflectionBridge talks to it purely via runtime reflection (see that
    // class), so the shipped mod works fine whether or not the end user has weather2
    // installed. It's only added here, as modLocalRuntime, so `runClient`/`runServer`
    // actually has it present to test the integration against.
    modLocalRuntime "maven.modrinth:weather-storms-tornadoes:1.20.1-2.8.3"
    modLocalRuntime "maven.modrinth:coroutil:1.20.1-1.3.7"

  //  minieBundle "com.github.stephengold:Minie:9.0.3"
   // minieBundle "com.github.stephengold:Libbulletjme:21.2.1"

    minieBundle 'com.github.stephengold:jbullet:1.0.3'

    // javax.vecmath (required by JBullet — not bundled with JDK 9+)
    // Included in jbullet-jme; if using the original jbullet jar add:
    minieBundle 'javax.vecmath:vecmath:1.5.2'

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

// =====================================================
// SHADOW
// =====================================================
shadowJar {
    configurations = [
            project.configurations.shadowCommon,
            project.configurations.minieBundle
    ]

    relocate "com.jme3", "mc.craig.software.shadow.jme3"
    relocate "com.simsilica", "mc.craig.software.shadow.simsilica"
    relocate "io.github.electrostat_lab.snaploader", "mc.craig.software.shadow.snaploader"

    mergeServiceFiles()

    // Nuclear — strip ALL module descriptors from every jar
    exclude "module-info.class"
    exclude "META-INF/versions/*/module-info.class"
    exclude "META-INF/MANIFEST.MF"  // stops Automatic-Module-Name headers sneaking through

    // SLF4J
    exclude "org/slf4j/**"
    exclude "META-INF/maven/org.slf4j/**"

    // Sim-Math
    exclude "META-INF/maven/com.simsilica/**"

    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    archiveClassifier = "dev-shadow"
}

remapJar {
    dependsOn shadowJar
    input.set shadowJar.archiveFile
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}